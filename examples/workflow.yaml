# Governed auto-remediation workflow declaration
# Adapt scope.services and scope.allowed_categories to your environment.
# This file defines the autonomy boundaries for a starter scope.
#
# Tool names in guardrails.require_human_approval_if and never_allow
# correspond directly to schemas/tool-*.json contract names.

workflow:
  name: incident-auto-remediation-v1
  version: "1.1.0"
  objective: "Reduce MTTR for recurrent low-risk incidents without increasing change failure rate"

  scope:
    services: ["checkout-api", "payments-gateway"]
    allowed_categories: ["cert-expiry", "svc-restart", "dns-misconfig"]
    change_windows_allowed: ["standard-hours", "low-traffic"]
    excluded_environments: ["production-critical-tier0"]

  agents:
    - name: triage
      responsibilities: ["classify", "deduplicate", "link_ci", "open_or_update_ticket"]
    - name: diagnostics
      responsibilities: ["collect_logs", "collect_metrics", "collect_traces", "suggest_root_cause"]
    - name: remediation
      responsibilities: ["select_runbook", "generate_plan", "execute_via_tools"]
    - name: change_risk
      responsibilities: ["risk_score", "decide_approval_route", "prepare_rollback"]

  autonomy_budget:
    max_actions_per_incident: 3
    max_tool_calls_per_incident: 5
    max_runtime_seconds: 180

  guardrails:
    must_use_dry_run_first: true

    # Freshness is an admission criterion, not a warning. Above these
    # thresholds the plan is denied and the incident goes to the named
    # human owner rather than being executed against stale topology.
    # Enforced by policies/enforce_context_freshness.rego.
    context_freshness:
      cmdb_max_age_seconds: 300
      metrics_max_age_seconds: 60
      on_stale_context: "deny_and_escalate"

    # Approval is bound to a specific plan hash for a bounded window.
    # Any re-planning invalidates the approval and requires a new one.
    approval_binding:
      bind_to_plan_hash: true
      approval_valid_for_seconds: 900

    require_human_approval_if:
      - "risk_score >= 0.60"
      - "blast_radius.services_affected > 1"
      - "tools contains any_of: ['rollback_deployment', 'iam_change', 'dns_write']"
    never_allow:
      - "tools contains any_of: ['delete_data', 'disable_audit', 'mass_restart']"
    rate_limits:
      max_auto_remediations_per_hour: 10
      max_auto_remediations_per_service_per_hour: 3

  evidence_bundle:
    must_attach_before_execute:
      - "workflow_version"
      - "plan_hash"
      - "tool_contract_versions"
      - "context_freshness"
      - "signal_context"
      - "service_context"
      - "diagnostics_summary"
      - "remediation_plan"
      - "policy_decision"
      - "rollback_plan"
    must_attach_after_execute:
      - "execution_log"
      - "validation_results"
      - "rollback_results_if_any"

  observability:
    trace_propagation: "W3C traceparent"
    semantic_conventions: "opentelemetry-genai"
    metrics_prefix: "itsm.agent."
    required_metrics:
      - "triage_duration_seconds"
      - "diagnostics_duration_seconds"
      - "policy_decision"
      - "context_freshness_seconds"
      - "stale_context_denials"
      - "tool_execution_duration_seconds"
      - "validation_result"
      - "rollback_count"
